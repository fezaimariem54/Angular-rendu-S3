<div class="container my-5">
  <h2 class="text-center mb-4">Liste des conférences</h2>

  <div class="row g-4">

    @for (conf of list; track conf.title) {
      <div class="col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm">
          <img [src]="conf.picture" class="card-img-top" [alt]="conf.title">
          <div class="card-body">
            <h5 class="card-title">{{ conf.title }}</h5>
            <p class="card-text mb-1"><strong>Date :</strong> {{ conf.date }}</p>
            <p class="card-text mb-1"><strong>Adresse :</strong> {{ conf.adress }}</p>
            <p class="card-text"><strong>Places disponibles :</strong> <span class="badge bg-success">{{ conf.available_Places }}</span></p>
          </div>
        </div>
      </div>
    }

  </div>
</div>
