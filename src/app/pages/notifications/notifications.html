<div class="container my-3">
  <div class="card shadow-sm border-start border-warning border-4">
    <div class="card-body d-flex align-items-center gap-4">
      <i class="fa fa-bell fa-3x text-warning"></i>
      <div>
        <h3>Zone de notifications</h3>
        <p>Vous avez {{ notifications.length }} nouvelles notifications.</p>

        <!--Event binding-->
        <button class="btn btn-outline-secondary btn-sm" (click)="toggle()">
          {{ afficher ? 'Masquer' : 'Afficher' }} les notifications
        </button>

        @if (afficher) {
          <ul class="mt-2">
            @for (n of notifications; track n) {
              <li>{{ n }}</li>
            }
          </ul>
        }
      </div>
    </div>
  </div>
</div>
